<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aloud Live</title>
<meta name="description" content="A display that reads aloud whatever it is sent, highlighting each word as it is spoken.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Spectral:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f7f7; --ink:#000; --past:#7a7a7a; --ahead:#c6c6c6;
    --quiet:#6e6e6e; --rule:#dedede; --mark:#ffe24a;
    --serif:"Spectral",Georgia,"Times New Roman",serif;
    --sans:"Archivo",system-ui,-apple-system,sans-serif;
    --verse:clamp(1.2rem, 1.05rem + 1.25vw, 2.5rem);
    --measure:34em;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.5;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--mark)}

  .page{
    width:100%;max-width:calc(var(--measure) * 1.0);
    margin:0 auto;padding:0 clamp(1rem, 4vw, 3rem);
    font-size:var(--verse);
  }

  /* running head: the work's title and author, as a book prints them */
  .head{
    display:flex;justify-content:space-between;align-items:baseline;gap:1em;
    padding:clamp(1.25rem, 4vh, 3rem) 0 0;
    font-size:max(.875rem, .42em);
    min-height:3em;
  }
  .head .title{font-family:var(--serif);font-style:italic;font-weight:400;margin:0;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .head .author{color:var(--quiet);white-space:nowrap}

  .stage{padding:clamp(1.5rem, 6vh, 4rem) 0 clamp(5rem, 30vh, 16rem)}

  /* turning from one poem to the next: head, verse and progress dim together */
  .page,.progress{transition:opacity .65s ease}
  body.turning .page,body.turning .progress{opacity:0}

  .idle{
    font-family:var(--serif);font-style:italic;font-weight:300;
    color:var(--ahead);margin:12vh 0 0;
  }

  /* the poem */
  .poem{font-family:var(--serif);font-weight:400;line-height:1.85}
  .stanza{margin:0 0 1.85em}
  .stanza:last-child{margin-bottom:0}
  .vline{position:relative;color:var(--ahead);transition:color .3s ease}
  .vline[data-state="past"]{color:var(--past)}
  .vline[data-state="now"],.vline[data-state="rest"]{color:var(--ink)}
  .vline .body{display:block;padding-left:1.2em;text-indent:-1.2em}
  .vline .indent{padding-left:1.6em;display:inline-block}
  .vline .num{
    position:absolute;right:calc(100% + 1.1em);top:.9em;
    font-family:var(--sans);font-size:max(.6875rem, .3em);color:var(--ahead);
    font-variant-numeric:tabular-nums;
  }
  .dir{
    display:block;font-family:var(--sans);font-size:max(.75rem, .34em);
    line-height:1.4;color:var(--past);margin:0 0 .1em;
  }
  .dir::before{content:"— "}

  .prose .vline .body{padding-left:0;text-indent:0}
  .prose .stanza{margin-bottom:1.1em}
  .prose .vline .num{display:none}

  .w{background-repeat:no-repeat;background-size:0 100%}
  .vline[data-state="now"] .w.lit{
    background-image:linear-gradient(to bottom,
      transparent 7%, var(--mark) 7%, var(--mark) 92%, transparent 92%);
    background-size:var(--fill,100%) 100%;
    padding:0 .07em;margin:0 -.07em;
    -webkit-box-decoration-break:clone;box-decoration-break:clone;
  }

  /* progress: a hairline along the foot of the screen */
  .progress{position:fixed;left:0;right:0;bottom:0;height:2px;background:var(--rule)}
  .progress i{display:block;height:100%;width:0;background:var(--ink)}

  /* controls: quiet until reached for */
  .controls{
    position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;gap:.5rem;opacity:.6;transition:opacity .3s ease;
  }
  .controls:hover,.controls:focus-within{opacity:1}
  body.turning .controls{opacity:.25}
  .controls button{
    appearance:none;width:3rem;height:3rem;padding:0;display:grid;place-items:center;
    background:var(--paper);color:var(--ink);border:1px solid var(--rule);cursor:pointer;
  }
  .controls button.primary{border-color:var(--ink)}
  .controls button:hover:not(:disabled){border-color:var(--ink);background:var(--mark)}
  .controls button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .controls button:disabled{color:var(--ahead);cursor:default}
  .controls svg{display:block}

  .status{
    position:fixed;right:1rem;bottom:.9rem;font-size:.8125rem;color:var(--quiet);
  }

  /* a reading on its way: what was asked for, while its audio is prepared */
  .notice{
    position:fixed;left:1rem;bottom:.9rem;max-width:calc(50% - 7rem);
    font-size:.8125rem;color:var(--quiet);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;transition:opacity .4s ease;
  }
  .notice.on{opacity:1}
  .notice.on::before{
    content:"";display:inline-block;width:.45em;height:.45em;margin-right:.55em;
    border-radius:50%;background:var(--quiet);vertical-align:.1em;
    animation:breathe 1.6s ease-in-out infinite;
  }
  .notice.failed::before{animation:none;background:#b3261e}
  @keyframes breathe{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){.notice.on::before{animation:none}}
  @media (max-width:640px){.notice{bottom:3.6rem;max-width:calc(100% - 2rem)}}

  /* the one tap a browser needs before a page may make sound */
  .arm{
    position:fixed;inset:0;background:var(--paper);
    display:flex;flex-direction:column;justify-content:center;
    padding:0 clamp(1.5rem, 8vw, 8rem);cursor:pointer;
  }
  .arm h1{
    font-family:var(--serif);font-weight:300;
    font-size:clamp(2rem, 1.4rem + 3vw, 4.5rem);line-height:1.15;
    margin:0 0 .5em;max-width:14em;
  }
  .arm h1 .w{background-image:linear-gradient(to bottom,
      transparent 7%, var(--mark) 7%, var(--mark) 92%, transparent 92%);
    background-size:100% 100%;padding:0 .07em;margin:0 -.07em}
  .arm p{margin:0;color:var(--quiet);font-size:clamp(.9375rem, .85rem + .4vw, 1.25rem);max-width:30em}
  .arm.gone{opacity:0;pointer-events:none;transition:opacity .5s ease}

  .hidden{display:none !important}

  @media (max-width:700px){ .vline .num{display:none} }
  @media (prefers-reduced-motion:reduce){
    .page,.progress,.vline,.arm.gone{transition:none}
  }
</style>
</head>
<body>

<div class="page">
  <header class="head">
    <h1 class="title" id="title">Aloud</h1>
    <span class="author" id="author"></span>
  </header>
  <main class="stage" id="stage">
    <p class="idle" id="idle">The next reading will appear here.</p>
  </main>
</div>

<div class="progress hidden" id="progress"><i id="fill"></i></div>
<nav class="controls hidden" id="controls" aria-label="Reading">
  <button type="button" id="btn-back" aria-label="Back to the beginning">
    <svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true"><rect x="1" y="1" width="2" height="12" fill="currentColor"/><path d="M15 1 L5 7 L15 13 Z" fill="currentColor"/></svg>
  </button>
  <button type="button" id="btn-play" class="primary" aria-label="Pause"></button>
  <button type="button" id="btn-next" aria-label="Next in the queue">
    <svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true"><path d="M1 1 L11 7 L1 13 Z" fill="currentColor"/><rect x="13" y="1" width="2" height="12" fill="currentColor"/></svg>
  </button>
</nav>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<div class="status" id="status" role="status" aria-live="polite"></div>

<div class="arm" id="arm" role="button" tabindex="0" aria-label="Turn on sound">
  <h1>Tap anywhere to turn <span class="w">on sound</span>.</h1>
  <p>This screen then reads aloud whatever it is sent, and marks each word as it is spoken.</p>
</div>

<script>
(() => {
"use strict";

// The display owns playback: it keeps its own queue and decides what plays
// next. It speaks to the room only to say hello and to answer a query.

const qs = new URLSearchParams(location.search);
const hs = new URLSearchParams(location.hash.slice(1));
const API = (qs.get("api") || "https://aloud-live.pjander2.workers.dev").replace(/\/$/, "");
const KEY = hs.get("key") || qs.get("key") || "";
const SILENT = "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//NwwAAAAAAAAAAAAEluZm8AAAAPAAAACgAABMsAOzs7Ozs7Ozs7UVFRUVFRUVFRUWdnZ2dnZ2dnZ2d9fX19fX19fX19kpKSkpKSkpKSkqioqKioqKioqKi+vr6+vr6+vr6+1NTU1NTU1NTU1Orq6urq6urq6ur/////////////AAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAACQDBgAAAAAAAATL+A9CeQAAAAAAAAAAAAAAAAD/80DEAAAAA0gAAAAATEFNRTMuMTAwVVVVVVVVVVVVVUxBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVf/zQsRbAAADSAAAAABVVVVVVVVVVVVVVVVVVVVVVVVVVUxBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVf/zQMSkAAADSAAAAABVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NCxKMAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NAxKQAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/80LEowAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/80DEpAAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVUxBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVf/zQsSjAAADSAAAAABVVVVVVVVVVVVVVVVVVVVVVVVVVUxBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVf/zQMSkAAADSAAAAABVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NCxKMAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV";

// the choreography of a change of poem
const VOICE_FADE_MS = 1000;   // an interrupted voice trails off rather than stopping dead
const TURN_OUT_MS = 650;      // the page dims…
const TURN_IN_MS = 700;       // …and the next poem settles in
const BEAT_MS = 700;          // a breath before the first word
const GAP_MS = 2500;          // after a poem ends, a pause before the queue moves on

const $ = id => document.getElementById(id);
const dom = { title: $("title"), author: $("author"), stage: $("stage"), idle: $("idle"),
              progress: $("progress"), fill: $("fill"), status: $("status"), notice: $("notice"), arm: $("arm"),
              controls: $("controls"), back: $("btn-back"), play: $("btn-play"), next: $("btn-next") };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));

const audio = new Audio();          // one element for everything, unlocked by the first tap
audio.preload = "auto";
let actx = null, gain = null;       // Web Audio, so fades work where element volume is ignored (iOS)

let armed = false;
let current = null;                 // the entry on screen
let state = "idle";                 // idle · starting · waiting (needs a tap) · playing · paused · ended · stopped
let queue = [];                     // entries waiting their turn
let gapTimer = 0;
let turn = 0;                       // bumps on every change of poem; a superseded change stops quietly
let gen = 0;                        // bumps on every playback change, so a stale play() can't win
let pauseRequested = false;         // a pause that arrived mid-turn
let inbox = Promise.resolve();      // poems are handled strictly in the order they arrive
let rafId = 0, lastLine = -1;
let ws = null, backoff = 1000, pingTimer = 0, pongTimer = 0;

const setStatus = text => { dom.status.textContent = text || ""; };

/* A reading on its way. The Worker sends `preparing` when one is asked for
   (stage "requested", before a poem is chosen) and again while it is being
   voiced (stage "preparing", with title and author once known). The `poem`
   message that follows clears it; `prepared` with ok: false reports a failure. */
let noticeTimer = 0;
function setNotice(text, { failed = false, ms = 180000 } = {}) {
  clearTimeout(noticeTimer);
  dom.notice.textContent = text || "";
  dom.notice.classList.toggle("on", !!text);
  dom.notice.classList.toggle("failed", !!text && failed);
  if (text) noticeTimer = setTimeout(() => setNotice(""), ms);
}
function preparing({ stage, request, title, author }) {
  const work = title ? `“${title}”${author ? ` by ${author}` : ""}` : author ? `a poem by ${author}` : null;
  const asked = request ? `“${request}”` : null;
  setNotice(stage === "requested"
    ? `Asked for ${asked || "a reading"} · choosing a poem…`
    : `Preparing ${work || asked || "a reading"} · the audio is on its way…`);
}

/* ---------- typesetting ---------- */

function typeset(poem) {
  const view = document.createElement("article");
  view.className = "poem " + (poem.form === "prose" ? "prose" : "verse");
  const lines = [];
  let n = 0;
  for (const stanza of poem.stanzas) {
    const box = document.createElement("div");
    box.className = "stanza";
    for (const line of stanza.lines) {
      n++;
      const el = document.createElement("div");
      el.className = "vline";
      el.dataset.state = "ahead";
      if (n % 5 === 0) {
        const num = document.createElement("span");
        num.className = "num"; num.textContent = String(n);
        el.appendChild(num);
      }
      if (line.dirs && line.dirs.length) {
        const d = document.createElement("span");
        d.className = "dir"; d.textContent = line.dirs.join(", ");
        el.appendChild(d);
      }
      const body = document.createElement("span");
      body.className = "body";
      el.appendChild(body);
      let holder = body;
      if (line.indented) { holder = document.createElement("span"); holder.className = "indent"; body.appendChild(holder); }
      const words = line.words.map((w, i) => {
        const span = document.createElement("span");
        span.className = "w";
        // the trailing space lives inside the span so the stroke runs unbroken
        span.textContent = w.t + (i < line.words.length - 1 ? " " : "");
        holder.appendChild(span);
        return { node: span, s: w.s, e: w.e };
      });
      box.appendChild(el);
      lines.push({ node: el, start: line.start, end: line.end, words });
    }
    view.appendChild(box);
  }
  return { view, lines };
}

const clearWords = l => l.words.forEach(w => { w.node.classList.remove("lit"); w.node.style.removeProperty("--fill"); });

/** Put a poem on the page, unlit, while the page is dimmed. */
function swapIn(entry) {
  dom.stage.replaceChildren(entry.view);
  dom.title.textContent = entry.poem.title || "Aloud";
  dom.author.textContent = entry.poem.author || "";
  dom.progress.classList.remove("hidden");
  dom.fill.style.width = "0";
  lastLine = -1;
  entry.lines.forEach(l => { l.node.dataset.state = "ahead"; clearWords(l); });
  window.scrollTo(0, 0);
}

const turning = on => document.body.classList.toggle("turning", on);

/** The reading is over: the page reads as a printed page and scrolls freely. */
function rest() {
  if (!current) return;
  current.lines.forEach(l => { l.node.dataset.state = "rest"; clearWords(l); });
  if (state === "ended") dom.fill.style.width = "100%";
}

/* ---------- highlighting ---------- */

function paint() {
  if (!current) return;
  const t = audio.currentTime;
  const lines = current.lines;
  let index = 0;
  for (let i = 0; i < lines.length; i++) {
    const end = lines[i].end ?? Infinity;
    if (t >= lines[i].start && t < end) { index = i; break; }
    if (t >= end) index = i;
  }
  if (index !== lastLine) {
    lines.forEach((l, i) => {
      const s = i < index ? "past" : i === index ? "now" : "ahead";
      if (l.node.dataset.state !== s) l.node.dataset.state = s;
      if (i !== index) clearWords(l);
    });
    lastLine = index;
    if (state === "playing") keepInView(lines[index].node);
  }
  for (const w of lines[index].words) {
    if (t >= w.e) { w.node.classList.add("lit"); w.node.style.removeProperty("--fill"); }
    else if (t >= w.s) {
      w.node.classList.add("lit");
      const f = Math.max(0, Math.min(1, (t - w.s) / Math.max(0.001, w.e - w.s)));
      w.node.style.setProperty("--fill", (f * 100).toFixed(1) + "%");
    } else { w.node.classList.remove("lit"); w.node.style.removeProperty("--fill"); }
  }
  const d = isFinite(audio.duration) ? audio.duration : 0;
  dom.fill.style.width = d ? (Math.min(1, t / d) * 100) + "%" : "0";
}

function keepInView(node) {
  const r = node.getBoundingClientRect();
  if (r.top > innerHeight * 0.6 || r.top < innerHeight * 0.15) {
    scrollTo({ top: Math.max(0, scrollY + r.top - innerHeight * 0.36), behavior: reduced ? "auto" : "smooth" });
  }
}

const loop = () => { paint(); rafId = requestAnimationFrame(loop); };
audio.addEventListener("play", () => { if (!rafId) rafId = requestAnimationFrame(loop); });
audio.addEventListener("pause", () => { cancelAnimationFrame(rafId); rafId = 0; });
audio.addEventListener("ended", () => { cancelAnimationFrame(rafId); rafId = 0; finish(); });

/* ---------- the voice ---------- */

function fullVolume() {
  if (gain && actx) { const t = actx.currentTime; gain.gain.cancelScheduledValues(t); gain.gain.setValueAtTime(1, t); }
  audio.volume = 1;
}

/** Let the voice trail off instead of stopping dead. */
function fadeVoice(ms) {
  if (audio.paused) return Promise.resolve();
  if (gain && actx?.state === "running") {
    const g = gain.gain, t = actx.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(0.0001, t + ms / 1000);
  } else {
    const from = audio.volume, t0 = performance.now();
    const step = () => {
      const k = Math.min(1, (performance.now() - t0) / ms);
      audio.volume = from * (1 - k);
      if (k < 1 && !audio.paused) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  return sleep(ms);
}

/**
 * Start the audio element. A pending play() is rejected with AbortError
 * whenever it is paused or replaced before it begins, which is routine;
 * only NotAllowedError means the browser wants a tap first.
 */
function startAudio() {
  const mine = ++gen;
  fullVolume();
  state = "playing";
  audio.play().catch(err => {
    if (mine !== gen) return;
    if (err.name === "NotAllowedError") { state = "waiting"; dom.arm.classList.remove("gone"); }
    else console.warn("play failed:", err.name, err.message);
  });
}
function halt() { gen++; audio.pause(); }

/* ---------- playback and the queue ---------- */

function release(entry) {
  if (entry && entry !== current && !queue.includes(entry) && entry.url) { URL.revokeObjectURL(entry.url); entry.url = null; }
}

/**
 * Change to a new poem: the old voice trails off while the page dims, the
 * new poem settles in, and after a breath the voice begins. Any newer
 * change, stop or skip supersedes this one at its next step.
 */
async function play(entry) {
  clearTimeout(gapTimer); gapTimer = 0;
  const mine = ++turn;
  const voiceOn = state === "playing" && !audio.paused;
  pauseRequested = false;
  state = "starting";

  if (!reduced) turning(true);
  await Promise.all([voiceOn ? fadeVoice(VOICE_FADE_MS) : null, reduced ? null : sleep(TURN_OUT_MS)]);
  if (mine !== turn) return;
  halt();

  const previous = current;
  current = entry;
  swapIn(entry);
  if (entry.url) audio.src = entry.url;
  release(previous);
  turning(false);
  await sleep(reduced ? 0 : TURN_IN_MS);
  if (mine !== turn) return;

  if (!entry.url) { state = "ended"; rest(); advanceLater(); return; }   // shown without sound
  audio.currentTime = 0;
  await sleep(BEAT_MS);
  if (mine !== turn) return;
  if (pauseRequested) { pauseRequested = false; state = "paused"; return; }
  if (!armed) { state = "waiting"; return; }
  startAudio();
}

/** Back to the first word of the current poem, replayed from memory. */
async function restart() {
  if (!current?.url) return;
  clearTimeout(gapTimer); gapTimer = 0;
  const mine = ++turn;
  const voiceOn = state === "playing" && !audio.paused;
  pauseRequested = false;
  state = "starting";
  if (voiceOn) await fadeVoice(400);
  if (mine !== turn) return;
  halt();
  lastLine = -1;
  current.lines.forEach(l => { l.node.dataset.state = "ahead"; clearWords(l); });
  dom.fill.style.width = "0";
  scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" });
  audio.currentTime = 0;
  await sleep(BEAT_MS);
  if (mine !== turn) return;
  if (!armed) { state = "waiting"; return; }
  startAudio();
}

function finish() {
  state = "ended";
  rest();
  advanceLater();
}

function advanceLater() {
  if (!queue.length) return;
  gapTimer = setTimeout(() => { gapTimer = 0; play(queue.shift()); }, GAP_MS);
}

const busy = () => ["starting", "playing", "paused", "waiting"].includes(state) || !!gapTimer;

/* ---------- when the audio came without timings ---------- */

/** Stretches of near-silence in the audio, and where speech begins and ends. */
function findSilences(buffer) {
  const data = buffer.getChannelData(0), rate = buffer.sampleRate;
  const frame = Math.max(128, Math.round(rate * 0.02));
  const rms = [];
  for (let i = 0; i + frame <= data.length; i += frame) {
    let sum = 0;
    for (let j = i; j < i + frame; j++) sum += data[j] * data[j];
    rms.push(Math.sqrt(sum / frame));
  }
  if (!rms.length) return { silences: [], speechStart: 0, speechEnd: buffer.duration };
  const sorted = [...rms].sort((a, b) => a - b);
  const threshold = Math.max(sorted[Math.floor(sorted.length * 0.05)] * 3, sorted[Math.floor(sorted.length * 0.98)] * 0.04, 1e-4);
  const at = i => (i * frame) / rate;
  let first = rms.findIndex(v => v > threshold), last = rms.length - 1;
  while (last > 0 && rms[last] <= threshold) last--;
  if (first < 0) first = 0;
  const silences = [];
  let run = -1;
  for (let i = first; i <= last; i++) {
    if (rms[i] <= threshold) { if (run < 0) run = i; }
    else if (run >= 0) { if (at(i) - at(run) >= 0.11) silences.push({ start: at(run), end: at(i) }); run = -1; }
  }
  return { silences, speechStart: at(first), speechEnd: Math.min(buffer.duration, at(last + 1)) };
}

/**
 * The Worker's estimate spreads words by length; the audio says where the
 * voice actually pauses. Each line's start is moved to the end of the
 * nearest real pause, and its words are stretched to fit.
 */
async function refineTimings(entry, bytes) {
  try {
    const buffer = await new OfflineAudioContext(1, 1, 44100).decodeAudioData(bytes);
    const { silences, speechStart, speechEnd } = findSilences(buffer);
    const lines = entry.lines.filter(l => l.words.length);
    if (lines.length < 1) return;
    const old = lines.map(l => ({ s: l.words[0].s, e: l.words[l.words.length - 1].e }));
    const starts = old.map(o => o.s);
    starts[0] = speechStart;
    const tol = Math.min(0.9, Math.max(0.22, ((speechEnd - speechStart) / lines.length) * 0.42));
    for (let i = 1; i < lines.length; i++) {
      let best = null, gap = Infinity;
      for (const z of silences) {
        const d = Math.abs(z.end - starts[i]);
        if (d < gap && d <= tol) { gap = d; best = z; }
      }
      if (best) starts[i] = best.end;
    }
    for (let i = 1; i < starts.length; i++) if (starts[i] < starts[i - 1] + 0.15) starts[i] = starts[i - 1] + 0.15;
    lines.forEach((l, i) => {
      const next = i + 1 < lines.length ? starts[i + 1] : speechEnd;
      const pause = silences.find(z => Math.abs(z.end - next) < 0.01);
      const end = Math.max(starts[i] + 0.1, pause ? pause.start : next);
      const k = (end - starts[i]) / Math.max(0.05, old[i].e - old[i].s);
      l.words.forEach(w => { w.s = starts[i] + (w.s - old[i].s) * k; w.e = starts[i] + (w.e - old[i].s) * k; });
      l.start = i === 0 ? 0 : starts[i];
      l.end = i + 1 < lines.length ? starts[i + 1] : null;
    });
    entry.refined = true;
  } catch { /* keep the Worker's estimate */ }
}

async function receive({ mode, poem, audio: path }) {
  const entry = { poem, url: null, ...typeset(poem) };
  try {
    const res = await fetch(API + path);
    if (res.ok) {
      const bytes = await res.arrayBuffer();
      entry.url = URL.createObjectURL(new Blob([bytes], { type: "audio/mpeg" }));
      if (!poem.exact) await refineTimings(entry, bytes.slice(0));
    }
  } catch { /* shown without sound */ }
  if (mode === "now" || !busy()) play(entry);     // not awaited: the next message needn't wait for the turn
  else queue.push(entry);
}

function control(action) {
  if (action === "pause") {
    if (state === "playing") { halt(); state = "paused"; }
    else if (state === "starting") pauseRequested = true;
    else if (state === "waiting") state = "paused";
  } else if (action === "resume") {
    if (state === "starting") pauseRequested = false;
    else if (state === "paused") { if (armed) startAudio(); else state = "waiting"; }
  } else if (action === "restart") {
    return restart();
  } else if (action === "skip") {
    clearTimeout(gapTimer); gapTimer = 0;
    if (queue.length) { play(queue.shift()); return; }
    if (!current) return;
    turn++;
    const wasOn = state === "playing";
    state = "ended";
    turning(false);
    rest();
    (wasOn ? fadeVoice(VOICE_FADE_MS) : Promise.resolve()).then(() => { if (state === "ended") halt(); });
  } else if (action === "stop") {
    clearTimeout(gapTimer); gapTimer = 0;
    turn++;
    const dropped = queue; queue = [];
    dropped.forEach(release);
    const wasOn = state === "playing";
    state = current ? "stopped" : "idle";
    turning(false);
    if (current) rest();
    (wasOn ? fadeVoice(600) : Promise.resolve()).then(() => { if (state === "stopped" || state === "idle") halt(); });
  }
}

function answer(qid) {
  const d = isFinite(audio.duration) ? audio.duration : current?.poem.duration || 0;
  send({
    type: "state", qid, armed, status: state,
    poem: current ? { title: current.poem.title, author: current.poem.author } : null,
    position: current ? +audio.currentTime.toFixed(1) : 0,
    duration: current ? +d.toFixed(1) : 0,
    queue: queue.map(e => ({ title: e.poem.title, author: e.poem.author }))
  });
}

/* ---------- controls on the page ---------- */

const ICONS = {
  play: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 1 L13 7 L2 13 Z" fill="currentColor"/></svg>',
  pause: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" fill="currentColor"/></svg>'
};
let shownIcon = "";
function renderControls() {
  dom.controls.classList.toggle("hidden", !current);
  if (!current) return;
  const sounding = state === "playing" || (state === "starting" && !pauseRequested);
  const icon = sounding ? "pause" : "play";
  if (icon !== shownIcon) {
    dom.play.innerHTML = ICONS[icon];
    dom.play.setAttribute("aria-label", sounding ? "Pause" : state === "ended" || state === "stopped" ? "Play again" : "Play");
    shownIcon = icon;
  }
  dom.play.disabled = dom.back.disabled = !current.url;
  dom.next.disabled = queue.length === 0;
}
setInterval(renderControls, 200);

function togglePlay() {
  if (state === "playing") control("pause");
  else if (state === "paused") control("resume");
  else if (state === "starting") pauseRequested = !pauseRequested;
  else if (state === "ended" || state === "stopped") restart();
  else if (state === "waiting") arm();
  renderControls();
}
dom.play.addEventListener("click", togglePlay);
dom.back.addEventListener("click", () => { restart(); renderControls(); });
dom.next.addEventListener("click", () => { if (queue.length) control("skip"); renderControls(); });

document.addEventListener("keydown", e => {
  if (!armed) { arm(); return; }
  if (e.target instanceof HTMLButtonElement && (e.key === " " || e.key === "Enter")) return;   // the button handles it
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); restart(); }
  else if (e.key === "ArrowRight" && queue.length) { e.preventDefault(); control("skip"); }
});

/* ---------- the socket ---------- */

function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

function connect() {
  ws = new WebSocket(API.replace(/^http/, "ws") + "/ws");
  ws.onopen = () => {
    backoff = 1000;
    ws.send(JSON.stringify({ type: "hello", key: KEY }));
    setStatus("");
    clearInterval(pingTimer);
    pingTimer = setInterval(() => {            // answered by the runtime; the room stays asleep
      if (ws.readyState !== 1) return;
      ws.send("ping");
      clearTimeout(pongTimer);
      pongTimer = setTimeout(() => ws.close(), 10000);
    }, 25000);
  };
  ws.onmessage = e => {
    if (e.data === "pong") { clearTimeout(pongTimer); return; }
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === "poem") { setNotice(""); inbox = inbox.then(() => receive(msg)).catch(() => {}); }
    else if (msg.type === "preparing") preparing(msg);
    else if (msg.type === "prepared" && !msg.ok) setNotice("Couldn't prepare that reading.", { failed: true, ms: 8000 });
    else if (msg.type === "control") inbox = inbox.then(() => control(msg.action));
    else if (msg.type === "query") answer(msg.qid);
  };
  ws.onclose = e => {
    clearInterval(pingTimer); clearTimeout(pongTimer);
    if (e.code === 4401) { setStatus("The display key was not accepted."); return; }
    setStatus("Reconnecting…");
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 30000);
  };
}

/* ---------- arming ---------- */

async function holdScreen() { try { await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && armed) holdScreen(); });

function wireAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    gain = actx.createGain();
    actx.createMediaElementSource(audio).connect(gain).connect(actx.destination);
  } catch { actx = null; gain = null; }
}

async function arm() {
  dom.arm.classList.add("gone");
  if (!armed) {
    armed = true;
    wireAudio();
    try { await actx?.resume(); } catch {}
    const keep = audio.getAttribute("src"), at = audio.currentTime;
    audio.src = SILENT;
    try { await audio.play(); } catch {}
    audio.pause();
    if (keep) { audio.src = keep; audio.currentTime = at; }
    holdScreen();
  }
  if (state === "waiting" && current?.url) startAudio();
}
dom.arm.addEventListener("pointerdown", arm);

/* ---------- start ---------- */

if (!KEY) {
  dom.arm.classList.add("gone");
  setStatus("This display needs its key: add #key=… to the address.");
} else {
  connect();
}

// read-only handle for the end-to-end tests
window.__aloud = { audio, get state() { return state; }, get queue() { return queue.map(e => e.poem.title); },
                   get title() { return current?.poem.title || null; }, get armed() { return armed; },
                   get starts() { return current ? current.lines.map(l => +(l.words[0]?.s ?? 0).toFixed(2)) : []; },
                   get refined() { return !!current?.refined; },
                   get gain() { return gain ? gain.gain.value : audio.volume; } };
})();
</script>
