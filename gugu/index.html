<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1b1420">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>GUGU — pierwsze dwa lata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#1b1420;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:Nunito,system-ui,sans-serif;overscroll-behavior:none}
#wrap{position:fixed;top:0;left:50%;transform:translateX(-50%);overflow:hidden;background:#140f1a;box-shadow:0 0 60px rgba(0,0,0,.5)}
#wrap canvas{position:absolute;left:0;top:0;display:block;touch-action:none}
#world{transform-origin:50% 50%;will-change:filter}
#album{position:absolute;inset:0;background:rgba(20,14,26,.94);display:none;z-index:5;touch-action:pan-y}
#album.open{display:block;animation:fin .35s ease}
@keyframes fin{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
#album .inner{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 18px 70px;color:#f3ecf6;touch-action:pan-y;-webkit-user-select:text;user-select:text}
.ab-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.ab-head .kick{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#f2cc8f;font-weight:900}
.ab-head h1{margin:2px 0 8px;font:900 34px Nunito,sans-serif}
.ab-head .x{background:#fffaf0;color:#3a2b34;border:0;border-radius:50%;width:40px;height:40px;font:900 22px Nunito;cursor:pointer}
.lead{color:#d8cfe6;font-style:italic;font-weight:600;line-height:1.45;margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;margin:10px 0 20px}
figure{margin:0;background:#fffdf8;padding:8px 8px 10px;border-radius:2px;transform:rotate(var(--r));box-shadow:0 6px 18px rgba(0,0,0,.4)}
figure img,figure .noimg{width:100%;display:block;aspect-ratio:1/0.9;object-fit:cover;background:#ddd}
figcaption{color:#3a2b34;padding-top:6px;line-height:1.1}
figcaption b{display:block;font:700 21px Caveat,cursive}
figcaption span{display:block;font-size:11px;color:#7a6a70;font-weight:700;margin-top:2px}
#album h2{font:900 20px Nunito;margin:22px 0 8px;color:#fff}
#album h2 small{font-size:13px;color:#f2cc8f;margin-left:6px}
.tastes{list-style:none;padding:0;margin:0}
.tastes li{background:rgba(255,255,255,.06);border-radius:10px;padding:8px 12px;margin:0 0 6px;font-size:14px}
.tastes em{color:#e76f51;font-style:normal;font-weight:900;float:right}
.tastes span{color:#cfc4d8;font-size:12.5px;font-style:italic}
.words span{display:inline-block;background:#2a9d8f;color:#fff;border-radius:14px;padding:4px 11px;margin:0 6px 6px 0;font-weight:900;font-size:14px}
.words .more{background:transparent;color:#cfc4d8;font-style:italic;font-weight:700}
.eggs{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.eggs li{background:rgba(255,255,255,.05);border-radius:10px;padding:7px 10px;font-size:13px;color:#7d7088;font-weight:800}
.eggs li.on{color:#e2d4ff;background:rgba(179,136,235,.18)}
.stats{list-style:none;padding:0;margin:0}
.stats li{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14.5px;color:#d8cfe6}
.stats b{color:#fff}
.patch{font:500 12.5px ui-monospace,Menlo,Consolas,monospace;background:#2a2135;border-radius:12px;padding:14px;margin:22px 0;line-height:1.5;color:#efe6f2}
.patch .pv{color:#8ab17d;font-weight:800;margin-bottom:6px}
.patch i{font-style:normal;font-weight:900;color:#8ab17d;margin-right:6px}
.credits p{margin:4px 0;color:#cfc4d8;font-size:13.5px}
.credits b{color:#fff}
.replay{display:block;width:100%;margin:28px 0 8px;padding:16px;border:0;border-radius:30px;background:#f2cc8f;color:#3a2b34;font:900 18px Nunito;cursor:pointer}
.note{text-align:center;color:#a99cb3;font-size:12px;font-style:italic;margin:0}
.empty{color:#a99cb3;font-style:italic}
#rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#1b1420;color:#f2cc8f;font:800 18px Nunito,sans-serif;z-index:9;text-align:center;padding:20px}
</style>

<body>
<div id="wrap">
  <canvas id="world"></canvas>
  <canvas id="ui"></canvas>
  <div id="album"><div class="inner"></div></div>
</div>
<div id="rotate">Obróć telefon pionowo 📱<br>— niemowlęta też wolą pion.</div>
<script>
// ---- 00-core.js ----
'use strict';
// ================= UTILS =================
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const choice = (a) => a[Math.floor(Math.random() * a.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = (t) => { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeBack = (t) => { t = clamp(t, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const approach = (v, t, r, dt) => lerp(v, t, 1 - Math.exp(-r * dt));
function hash01(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash01(i), hash01(i + 1), u) * 2 - 1; }
function strHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const FONT = '"Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const HAND = '"Caveat", "Nunito", cursive';
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
const F = (size, weight = 700, fam = FONT) => `${weight} ${size}px ${fam}`;

// ================= CANVAS =================
const SCENES = {};
const $wrap = document.getElementById('wrap'), $world = document.getElementById('world'), $ui = document.getElementById('ui');
const wctx = $world.getContext('2d'), uctx = $ui.getContext('2d');
let W = 400, H = 760, SC = 1, DPR = 1;
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let w = Math.min(vw, Math.max(320, vh * 0.6));
  if (vw < 720 && vw <= vh) w = vw;
  const h = vh;
  $wrap.style.width = w + 'px'; $wrap.style.height = h + 'px';
  SC = w / 400; W = 400; H = h / SC;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  for (const c of [$world, $ui]) { c.width = Math.round(w * DPR); c.height = Math.round(h * DPR); c.style.width = w + 'px'; c.style.height = h + 'px'; }
  lastFilter = '#';
  document.getElementById('rotate').style.display = (vw > vh && vh < 520) ? 'flex' : 'none';
}
let lastFilter = '';
const vision = { blur: 0, gray: 0, tBlur: 0, tGray: 0 };
function setVision(b, g, instant) { vision.tBlur = b; vision.tGray = g; if (instant) { vision.blur = b; vision.gray = g; } }
function updateVision(dt) {
  vision.blur = approach(vision.blur, vision.tBlur, 1.6, dt);
  vision.gray = approach(vision.gray, vision.tGray, 1.6, dt);
  let f = '';
  if (vision.blur > 0.06) f += `blur(${(vision.blur * SC).toFixed(1)}px) `;
  if (vision.gray > 0.01) f += `grayscale(${vision.gray.toFixed(2)})`;
  if (!f) f = 'none';
  if (f !== lastFilter) {
    $world.style.filter = f; lastFilter = f;
    $world.style.transform = vision.blur > 0.06 ? `scale(${(1 + vision.blur * 0.012).toFixed(3)})` : 'none';
  }
}

// ================= SAVE =================
const SAVE_KEY = 'gugu-save-v1';
function freshSave() {
  return { ch: null, tastes: [], known: [], counts: {}, stats: { falls: 0, cry: 0, bonks: 0, throws: 0, laughs: 0, named: 0, steps: 0, nie: 0 }, firstWord: null, prophecy: null, motor: 1, ballLost: false };
}
let SAVE = freshSave();
let META = { album: [], eggs: [], finished: 0, muted: false };
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { }
  try { localStorage.setItem(SAVE_KEY + '-meta', JSON.stringify(META)); } catch (e) { }
}
function load() {
  try { const s = localStorage.getItem(SAVE_KEY); if (s) SAVE = Object.assign(freshSave(), JSON.parse(s)); } catch (e) { }
  try { const m = localStorage.getItem(SAVE_KEY + '-meta'); if (m) META = Object.assign(META, JSON.parse(m)); } catch (e) { }
}

// ================= SCRIPT (generator coroutines) =================
class Script {
  constructor(genFn, ctx) { this.it = genFn.call(ctx); this.wait = 0; this.cond = null; this.done = false; this.advance(); }
  advance() {
    for (let guard = 0; guard < 200; guard++) {
      let r;
      try { r = this.it.next(); } catch (e) { console.error(e); this.done = true; return; }
      if (r.done) { this.done = true; return; }
      const v = r.value;
      if (typeof v === 'number') { if (v > 0) { this.wait = v; return; } }
      else if (typeof v === 'function') { if (!v()) { this.cond = v; return; } }
      else return; // bare yield: one frame
    }
  }
  update(dt) {
    if (this.done) return;
    if (this.wait > 0) { this.wait -= dt; if (this.wait > 0) return; this.wait = 0; }
    if (this.cond) { if (!this.cond()) return; this.cond = null; }
    this.advance();
  }
}

// ================= GAME / LOOP =================
const G = { t: 0, last: 0, scene: null, name: '', fade: 0, fadeDir: 0, next: null, shake: 0, cam: { x: 0, y: 0 }, ver: 'v0.0', label: null };
function go(name, opts) { if (G.next) return; G.next = { name, opts }; G.fadeDir = 1; }
function startScene(name, opts) {
  G.name = name; G.scene = SCENES[name]; G.cam.x = 0; G.cam.y = 0; G.shake = 0;
  Bubbles.list.length = 0; Particles.list.length = 0;
  UI.obj = null; UI.hint = null; UI.big = null; UI.taste = null;
  G.scene.script = null; G.scene.sub = null;
  if (G.scene.chapter) { SAVE.ch = name; save(); }
  G.scene.enter(opts || {});
}
function shake(a) { G.shake = Math.max(G.shake, a); if (a >= 8) vibe(Math.min(60, a * 3)); }
function vibe(ms) { try { if (navigator.vibrate && !META.muted) navigator.vibrate(ms); } catch (e) { } }
function scr(x, y) { return { x: x - G.cam.x, y: y - G.cam.y }; }

function update(dt) {
  G.dt = dt;
  if (G.fadeDir === 1) { G.fade = Math.min(1, G.fade + dt * 2.6); if (G.fade >= 1) { const n = G.next; G.next = null; startScene(n.name, n.opts); G.fadeDir = -1; } }
  else if (G.fadeDir === -1) { G.fade = Math.max(0, G.fade - dt * 2.0); if (G.fade <= 0) G.fadeDir = 0; }
  updateVision(dt);
  G.shake *= Math.exp(-7 * dt); if (G.shake < 0.2) G.shake = 0;
  const blocked = UI.blocking();
  if (G.scene && !blocked && G.fadeDir !== 1) {
    G.scene.tick && G.scene.tick(dt);
    if (G.scene.script) G.scene.script.update(dt);
    if (G.scene.sub) { G.scene.sub.update(dt); if (G.scene.sub && G.scene.sub.done) G.scene.sub = null; }
  }
  Bubbles.update(blocked ? 0 : dt);
  Particles.update(dt);
  UI.update(dt);
}
function render() {
  wctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0);
  wctx.clearRect(0, 0, W, H);
  const sx = (Math.random() - 0.5) * G.shake, sy = (Math.random() - 0.5) * G.shake;
  wctx.save(); wctx.translate(sx - G.cam.x, sy - G.cam.y);
  if (G.scene) G.scene.draw(wctx);
  wctx.restore();
  uctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0);
  uctx.clearRect(0, 0, W, H);
  if (G.scene && G.scene.drawUI) G.scene.drawUI(uctx);
  Bubbles.draw(uctx);
  Particles.draw(uctx);
  UI.draw(uctx);
  if (G.fade > 0) { uctx.fillStyle = `rgba(22,15,26,${G.fade})`; uctx.fillRect(0, 0, W, H); }
}
let frameErr = 0;
function loop(ts) {
  const t = ts / 1000;
  const dt = Math.min(0.05, Math.max(0, t - (G.last || t)));
  G.last = t; G.t += dt;
  try { update(dt); render(); } catch (e) { if (frameErr++ < 5) console.error(e); }
  requestAnimationFrame(loop);
}

// ================= INPUT =================
const pointers = new Map();
const nowS = () => performance.now() / 1000;
function toLocal(e) { const r = $ui.getBoundingClientRect(); return { x: (e.clientX - r.left) / SC, y: (e.clientY - r.top) / SC }; }
function firstPointer() { for (const p of pointers.values()) if (!p.consumed) return p; return null; }
function anyHeld(minDur = 0) { const t = nowS(); for (const p of pointers.values()) if (!p.consumed && t - p.t0 >= minDur) return p; return null; }
function setupInput() {
  $ui.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    audioInit();
    const q = toLocal(e), t = nowS();
    const p = { id: e.pointerId, x: q.x, y: q.y, sx: q.x, sy: q.y, t0: t, tl: t, vx: 0, vy: 0, path: [{ x: q.x, y: q.y }], consumed: false };
    p.wx = p.x + G.cam.x; p.wy = p.y + G.cam.y;
    pointers.set(e.pointerId, p);
    try { $ui.setPointerCapture(e.pointerId); } catch (_) { }
    if (UI.down(p)) { p.consumed = true; return; }
    if (G.fadeDir === 1 || UI.blocking()) { p.consumed = true; return; }
    G.scene && G.scene.down && G.scene.down(p);
  }, { passive: false });
  $ui.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId); if (!p) return;
    const q = toLocal(e), t = nowS(), dtm = Math.max(0.008, t - p.tl);
    const nvx = (q.x - p.x) / dtm, nvy = (q.y - p.y) / dtm;
    p.vx = lerp(p.vx, nvx, 0.5); p.vy = lerp(p.vy, nvy, 0.5);
    p.x = q.x; p.y = q.y; p.tl = t; p.wx = p.x + G.cam.x; p.wy = p.y + G.cam.y;
    p.path.push({ x: q.x, y: q.y }); if (p.path.length > 300) p.path.shift();
    if (!p.consumed && G.scene && G.scene.move) G.scene.move(p);
  });
  const end = (e) => {
    audioInit();
    const p = pointers.get(e.pointerId); if (!p) return;
    pointers.delete(e.pointerId);
    p.dur = nowS() - p.t0; p.dist = dist(p.x, p.y, p.sx, p.sy);
    p.isTap = p.dur < 0.35 && p.dist < 16;
    p.wx = p.x + G.cam.x; p.wy = p.y + G.cam.y;
    if (!p.consumed && G.scene && G.scene.up) G.scene.up(p);
  };
  $ui.addEventListener('pointerup', end);
  $ui.addEventListener('pointercancel', end);
  document.addEventListener('touchmove', (e) => { if (e.target.closest && e.target.closest('#album')) return; e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('touchend', () => audioInit(), { passive: true });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (!AU.ctx) return; if (document.hidden) AU.ctx.suspend(); else AU.ctx.resume(); });
}

// ---- 01-audio.js ----
// ================= AUDIO (all synthesized) =================
const AU = { ctx: null, master: null, muted: false };
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try { AU.ctx = new AC(); } catch (e) { return; }
  const comp = AU.ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
  AU.master = AU.ctx.createGain(); AU.master.gain.value = META.muted ? 0 : 0.85;
  AU.master.connect(comp); comp.connect(AU.ctx.destination);
  try { const b = AU.ctx.createBuffer(1, 1, 22050), s = AU.ctx.createBufferSource(); s.buffer = b; s.connect(AU.master); s.start(0); } catch (e) { }
}
function setMuted(m) { META.muted = m; save(); if (AU.master) AU.master.gain.value = m ? 0 : 0.85; }
function osc(o) {
  if (!AU.ctx || META.muted) return;
  const c = AU.ctx, t0 = c.currentTime + (o.t || 0) + 0.005, d = o.d || 0.2;
  const g = c.createGain(), os = c.createOscillator(); os.type = o.type || 'sine';
  if (o.curve) { try { os.frequency.setValueCurveAtTime(new Float32Array(o.curve), t0, d); } catch (e) { os.frequency.value = o.curve[0]; } }
  else { os.frequency.setValueAtTime(o.f, t0); if (o.f1) os.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + d); }
  let node = os;
  if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib.f; lg.gain.value = o.vib.d; l.connect(lg); lg.connect(os.frequency); l.start(t0); l.stop(t0 + d + 0.1); }
  if (o.filter) { const fl = c.createBiquadFilter(); fl.type = o.filter.type || 'lowpass'; fl.frequency.value = o.filter.f; fl.Q.value = o.filter.q || 1; node.connect(fl); node = fl; }
  const a = o.a || 0.01, r = o.r || 0.08, v = o.v || 0.2;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a);
  g.gain.setValueAtTime(v, t0 + Math.max(a, d - r)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  node.connect(g); g.connect(AU.master); os.start(t0); os.stop(t0 + d + 0.05);
}
let NOISE = null;
function noiseBuf() { if (NOISE) return NOISE; const c = AU.ctx, n = Math.floor(c.sampleRate * 1.5); NOISE = c.createBuffer(1, n, c.sampleRate); const d = NOISE.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; return NOISE; }
function nz(o) {
  if (!AU.ctx || META.muted) return;
  const c = AU.ctx, t0 = c.currentTime + (o.t || 0) + 0.005, d = o.d || 0.2;
  const s = c.createBufferSource(); s.buffer = noiseBuf(); s.loop = true;
  const f = c.createBiquadFilter(); f.type = o.ft || 'lowpass'; f.frequency.setValueAtTime(o.f || 1000, t0); if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t0 + d); f.Q.value = o.q || 1;
  const g = c.createGain(), v = o.v || 0.2, a = o.a || 0.005;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  s.connect(f); f.connect(g); g.connect(AU.master); s.start(t0, Math.random()); s.stop(t0 + d + 0.05);
}
const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);
const SFX = {
  heart() { osc({ f: 70, f1: 42, d: 0.17, v: 0.55 }); osc({ f: 62, f1: 40, t: 0.19, d: 0.15, v: 0.38 }); nz({ f: 180, d: 0.1, v: 0.1 }); },
  thump() { osc({ f: 95, f1: 38, d: 0.28, v: 0.6 }); nz({ f: 260, d: 0.16, v: 0.25 }); },
  wah(k = 1) { const f = rand(390, 470), cv = [f, f * 1.22, f * 1.3, f * 1.12, f * 0.82]; osc({ type: 'sawtooth', curve: cv, d: 0.78, v: 0.08 * k, a: 0.06, r: 0.25, filter: { type: 'bandpass', f: 1300, q: 1.1 }, vib: { f: 7, d: 16 } }); osc({ type: 'triangle', curve: cv, d: 0.78, v: 0.07 * k, a: 0.06, r: 0.25 }); },
  coo() { const f = rand(400, 470); osc({ type: 'triangle', curve: [f * 0.9, f * 1.25, f * 1.05], d: 0.45, v: 0.16, a: 0.05, r: 0.2, filter: { type: 'lowpass', f: 1500 } }); osc({ type: 'sine', curve: [f * 1.8, f * 2.4, f * 2.1], d: 0.45, v: 0.03, a: 0.05, r: 0.2 }); },
  syl(s, t = 0) {
    const f = rand(400, 480), c = s[0], vw = s.replace(/[^aeiouyąęó]/g, '').slice(-1) || 'a';
    const vf = { a: 1000, u: 420, o: 620, e: 1600, i: 2300, y: 1500 }[vw] || 900;
    if ('bdtgkpc'.includes(c)) nz({ f: (c === 't' || c === 'k' || c === 'c') ? 3200 : 900, ft: 'bandpass', q: 1, t, d: 0.035, v: 0.16 });

function isSmileStroke(pts) {
  if (pts.length < 6) return 0;
  let minX = 1e9, maxX = -1e9, maxY = -1e9, minY = 1e9, iMax = 0, iMin = 0;
  pts.forEach((q, i) => { if (q.x < minX) minX = q.x; if (q.x > maxX) maxX = q.x; if (q.y > maxY) { maxY = q.y; iMax = i; } if (q.y < minY) { minY = q.y; iMin = i; } });
  const span = maxX - minX, a = pts[0], b = pts[pts.length - 1];
  if (span < 55 || Math.abs(a.x - b.x) < span * 0.45) return 0;
  const midLow = (pts[iMax].x - minX) / span, midHigh = (pts[iMin].x - minX) / span;

  return 0;
}

    if (R) R(); else setTimeout(() => say(choice(['mama', 'tata']), choice(['Hmm... rozumiem! (Nie rozumiem.)', 'Brzmi jak plan.', 'Tak? Super! A co to znaczy?'])), 1500);
  },
  giveCookie(who, line) { setTimeout(() => { say(who, line); this.b.holding = 'cookie'; this.gotCookie(); }, 1500); },
  gotCookie() {
    if (this.cookie) return; this.cookie = true; SFX.chime();
    setTimeout(() => { SFX.nom(); addTaste('cookie', 'Ciastko', 'Zdobyte słowami. Smakuje jak pierwsze zwycięstwo dyplomacji.', '11/10'); UI.showTaste({ kind: 'cookie', name: 'Ciastko', notes: 'Zdobyte słowami. Smakuje jak pierwsze zwycięstwo dyplomacji.', score: '11/10' }); UI.check(4); }, 1200);
    setTimeout(() => { this.b.holding = null; }, 4200);
  },
  *liftFlow() {
    this.blink = 1; yield 0.5;
    this.lift = { t: 0 }; say('tata', 'Hop! Do góry!'); SFX.whoosh();
    yield 1.0;
    if (this.b.x < 175) { say('tata', 'Ciastka? Sięgaj!'); yield 0.8; this.b.holding = 'cookie'; this.gotCookie(); SFX.pop(); yield 1.4; }
    else { say('tata', 'Hop! I co teraz? Ciastka są na regale, po lewej...'); yield 2.2; }

  },
  interactables() {
    const s = this;
    return [
      { x: APT.mirror + 36, icon: '🪞', label: 'lustro', cond: () => !s.mirrorDone, act: () => s.startMirror() },
      { x: 520, icon: '🍌', label: 'banan', r: 50, cond: () => !s.phoneDone || true, act: () => { s.choice = { x: 520, opts: [{ label: '😋 zjedz', fn: () => s.eatBanana() }, { label: '📞 zadzwoń', fn: () => { s.sub = new Script(s.phoneFlow, s); } }] }; } },
      { x: 65, icon: '🍪', label: 'ciastka', cond: () => !s.cookie, act: () => { say('baby', 'hop! hop!', { dur: 1.2 }); SFX.boing(); setTimeout(() => say('tata', s.spurt ? 'Za wysoko? To poproś. Dwa słowa wystarczą.' : 'Za wysoko, skarbie. Najpierw trzeba umieć poprosić.'), 1300); } },
      { x: APT.door + 50, icon: '🚪', label: 'drzwi', cond: () => true, act: () => { SFX.bad(); UI.pill('Nadal zablokowane. Wymagane: klamka (~v3.0)'); } },
    ];
  },
  eatBanana() {
    this.choice = null; SFX.nom(); addTaste('banana', 'Banan', 'Klasyk gatunku. Miękki, słodki, zawsze pod ręką.', '10/10');
    UI.showTaste({ kind: 'banana', name: 'Banan', notes: 'Klasyk gatunku. Miękki, słodki, zawsze pod ręką.', score: '10/10' });
    say('mama', 'Smacznego! W misce jest jeszcze pełno.');
  },
  *phoneFlow() {
    this.choice = null; this.mode = 'anim'; const b = this.b;
    b.holding = 'banana'; b.phoneT = 1;
    say('baby', 'halo? tata?', { dur: 2 }); yield 2.0;
    this.tata.phone = 1; this.tata.expr = 'joy';
    yield say('tata', 'Halo, tu tata! Co słychać?');
    say('baby', 'bibo am!', { dur: 1.8 }); yield 1.9;
    yield say('tata', 'Bigos jadł? Dziękuję za raport!');
    this.tata.phone = 0; this.tata.expr = 'smile';
    milestone('Zabawa symboliczna', 'Banan jako telefon: jedna rzecz zastępuje drugą w głowie. Piaget uznał to za znak ostatniego podstadium — myślenia za pomocą reprezentacji, nie tylko rąk.');
    yield 0.6; photo('Halo, tata?', 'udawanie · ok. 18.–24. miesiąca', this.gy - 160);
    yield 1.8; b.holding = null; b.phoneT = 0; this.phoneDone = true; UI.check(2); this.mode = 'walk';
  },
  startMirror() {
    this.closeup = { state: 'ask', jam: true, t: 0 }; this.mode = 'mirror'; SFX.pop();
    say('mama', 'Kto to jest w lustrze? Ojej, ktoś ma dżem na nosie!', { anchor: () => ({ x: 200, y: 120 }) });
    UI.setHint('Gdzie jest plamka dżemu? Pokaż!');
  },
  *mirrorFlow() {
    const cu = this.closeup; cu.state = 'me'; UI.setHint(null); SFX.laugh(); shake(4);
    say('baby', 'JA! TO JA!', { dur: 2.2 });
    yield 1.2;
    say('mama', 'Tak! To ty! Brawo!', { anchor: () => ({ x: 200, y: 120 }) });
    milestone('Samorozpoznanie', 'Test lustra z plamką (Amsterdam, 1972): ok. 18.–24. miesiąca dziecko dotyka własnego nosa, nie odbicia. Wie, że to ono.');
    yield 0.8; photo('To ja!', 'test lustra · ok. 18.–24. miesiąca', this.gy - 200);
    yield 2.0;
    egg('avatar', 'To ja', 'Od teraz postać na ekranie to oficjalnie Ty. Identyfikacja z awatarem — u ludzi zajmuje to półtora roku.');
    yield 1.6;
    cu.jam = false; this.b.jam = false;
    this.blink = 1; yield 0.5; this.closeup = null; this.mirrorDone = true; UI.check(1); this.mode = 'walk';
  },
  *spurtFlow() {
    this.spurt = 'run'; this.mode = 'anim'; UI.bigText('WYBUCH SŁÓW!', '#f2cc8f'); SFX.fanfare();
    for (let i = 0; i < 26; i++) {
      const w = SPURT[i % SPURT.length]; const s = scr(this.b.x, this.gy - 120);
      Particles.add({ kind: 'word', x: s.x + rand(-30, 30), y: s.y, vx: rand(-160, 160), vy: rand(-380, -160), g: 260, life: 2.2, text: w, col: choice(PCOLS), s: rand(0.8, 1.3) });
      if (i % 2 === 0) SFX.syl(w.slice(0, 2)); this.vocab += randi(5, 11); yield 0.09;
    }
    for (const w of BUILDER_WORDS) learnWord(w, true);
    this.vocab = Math.max(this.vocab, 260);
    yield 1.2;
    milestone('Wybuch słownictwa', 'Ok. 18. miesiąca tempo nauki słów gwałtownie rośnie — choć część badaczy uważa, że to raczej stały wzrost niż „wybuch” (Bloom, 2000). Maluch nie bierze udziału w tym sporze. Maluch gada.');
    yield 1.5;
    UI.pill('Odblokowano: 💬 zdania dwuwyrazowe');
    this.spurt = true; this.mode = 'walk';
    yield 2; say('tata', 'Ciastka są wysoko na regale. Ciekawe, kto je zdobędzie...');
  },
  down(p) {
    const gy = this.gy, b = this.b;
    if (this.mode === 'nie' && this.tut) {
      this.nie++; SAVE.stats.nie++; this.nieT = 1; shake(10); SFX.stomp(); say('baby', 'NIE!', { dur: 1.2 }); UI.bigText('NIE!', '#e76f51'); setTimeout(() => { this.nieT = 0; }, 900);
      const T = this.tut; T.t = 0;
      if (this.nie === 1) { T.msg = '…Dotknij mamy. Proszę. To tylko buty.'; setTimeout(() => say('mama', 'Buciki, kochanie?'), 1100); }
      else if (this.nie === 2) { T.msg = 'Rozumiem. Samouczek idzie do swojego pokoju.'; T.btn = null; setTimeout(() => say('mama', 'Hmm. No to może za chwilę?'), 1100); }
      else { T.sad = true; this.mama.holding = null; }
      return;
    }
    if (this.builder) { for (const h of this.builder.hit) if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) { p.consumed = true; h.fn(); return; } p.consumed = true; return; }
    if (this.choice) { for (const h of this.choice.btns || []) if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) { p.consumed = true; SFX.pop(); h.fn(); return; } this.choice = null; p.consumed = true; return; }
    if (this.mode === 'mirror' && this.closeup && this.closeup.state === 'ask') {
      const cu = this.closeup;
      if (cu.noseMe && dist(p.x, p.y, cu.noseMe.x, cu.noseMe.y) < 55) { this.sub = new Script(this.mirrorFlow, this); return; }
      if (cu.noseRef && dist(p.x, p.y, cu.noseRef.x, cu.noseRef.y) < 70) { cu.state = 'tap'; SFX.clink(); say('baby', 'stuk stuk?', { dur: 1.2 }); setTimeout(() => { if (this.closeup) this.closeup.state = 'ask'; }, 1100); if (!cu.told) { cu.told = true; setTimeout(() => say('mama', 'Plamka jest w lustrze? Hmm... a może gdzieś bliżej?', { anchor: () => ({ x: 200, y: 120 }) }), 1200); } return; }
      return;
    }
    for (const q of this.bubbles) if (dist(p.x, p.y, q.x, q.y) < q.r) { p.consumed = true; SFX.pop(); q.it.act(); return; }
  },
  up(p) {
    if (this.mode !== 'walk' || !p.isTap || p.consumed || this.builder || this.choice) return;
    const gy = this.gy, wx = p.x + G.cam.x, wy = p.y - gy;
    // name things
    let hit = null;
    for (const n of NAMES6) if (wx >= n.x0 && wx <= n.x1 && wy >= n.y0 && wy <= n.y1) hit = n;
    if (!hit && Math.abs(wx - this.cat.x) < 40 && wy > -70 && wy < 10) hit = { id: 'Bigos', say: 'bi-bo!' };
    if (!hit && this.tataHead && dist(wx, p.y, APT.tata + 20, this.tataHead.y + 40) < 60) hit = { id: 'tata', say: 'ta-ta!' };
    if (!hit && Math.abs(wx - this.mama.x) < 34 && wy > -360 && wy < 0) hit = { id: 'mama', say: 'ma-ma!' };
    if (!hit) return;
    say('baby', hit.say, { dur: 1.3 });
    if (!this.named.has(hit.id)) {
      this.named.add(hit.id); SAVE.stats.named++; this.vocab++;
      Particles.add({ kind: 'word', x: p.x, y: p.y - 10, vx: 0, vy: -60, g: 0, life: 1.6, text: hit.id, col: '#2a9d8f', s: 1 });
      const n = this.named.size; UI.relabel(3, `Nazwij 5 rzeczy (${Math.min(5, n)}/5)`);
      if (n === 1) setTimeout(() => say('mama', `Tak! ${hit.id === 'kanapa' ? 'Kanapa' : hit.id}! Mądrala!`), 1300);
      if (n === 5) { UI.check(3); this.sub = new Script(this.spurtFlow, this); }
    }
  },
};

// ================= ENDING: SECOND BIRTHDAY + CHILDHOOD AMNESIA =================
SCENES.ending = {
  get gy() { return H * 0.8; },
  enter() {
    G.ver = 'v2.0'; setVision(0, 0, true); LANG.level = 2;
    this.st = 'cake'; this.hold = 0; this.blown = false; this.lines = null; this.li = 0; this.lt = 0; this.night = 0; this.mExpr = 'smile'; this.tExpr = 'smile';
    META.finished = (META.finished || 0) + 1; save();
    this.script = new Script(this.flow, this);
  },
  anchor(who) { return who === 'mama' ? { x: 290, y: H * 0.3 - 80 } : { x: 110, y: H * 0.3 - 80 }; },
  *flow() {
    yield 0.6;
    say('mama', 'Sto lat, sto lat! Dwa latka!'); musicBox(KOTEK);
    yield 1.4; say('tata', 'Dmuchaj! Dwie świeczki!');
    UI.setHint('Przytrzymaj palec, żeby zdmuchnąć świeczki');
    yield () => this.blown;
    UI.setHint(null);
    Particles.burst(200, H * 0.45, 'confetti', 110, { sp1: 460 }); SFX.fanfare(); this.mExpr = 'joy'; this.tExpr = 'joy'; shake(5);
    say('mama', 'Brawo! Wszystkiego najlepszego!'); say('tata', 'Dwa lata! Kiedy to minęło?');
    yield 1.0; photo('Drugie urodziny', '24. miesiąc', H * 0.5);
    yield 3.2;
    this.st = 'text'; this.lt = 0;
    const fw = WORD_LABEL[SAVE.firstWord] || SAVE.firstWord || 'mama';
    this.lines = ['Dwa lata.', `Uśmiech. Butelka. Bigos. Pierwsze słowo: „${fw}”.`, 'Za kilka lat nie zostanie Ci z tego prawie nic.', 'Amnezja dziecięca: dorośli zwykle nie pamiętają niczego sprzed 3.–4. roku życia. Wczesne wspomnienia gasną mniej więcej do siódmych urodzin.', 'Ale ktoś pamięta za Ciebie.'];
    for (this.li = 0; this.li < this.lines.length; this.li++) { this.lt = 0; this.skip = false; yield () => this.skip || this.lt > (this.li === 3 ? 6 : 3.4); }
    this.st = 'night'; this.lt = 0;
    yield 3.4;
    openAlbum('ending');
  },
  tick(dt) {
    this.lt += dt;
    if (this.st === 'cake' && !this.blown) { const p = anyHeld(0); if (p) { this.hold += dt; if (Math.random() < dt * 10) Particles.burst(200, H * 0.48, 'smoke', 1, { sp1: 30, up: 50, g: -30 }); if (this.hold > 1.2) { this.blown = true; SFX.blow(); Particles.burst(200, H * 0.46, 'smoke', 18, { sp1: 90, up: 70, g: -40 }); } } else this.hold = Math.max(0, this.hold - dt); }
    if (this.st === 'night') this.night = Math.min(1, this.night + dt * 0.6);
  },
  draw(ctx) {
    if (this.st === 'cake') {
      ctx.fillStyle = '#fbe9e7'; ctx.fillRect(-20, -20, W + 40, H + 40);
      drawGarland(ctx, 0, W, 70); drawBalloon(ctx, 40, H * 0.12, '#e76f51', G.t); drawBalloon(ctx, 365, H * 0.14, '#2a9d8f', G.t);
      const tT = Bubbles.list.some((q) => q.who === 'tata' && q.t < q.dur * 0.7), mT = Bubbles.list.some((q) => q.who === 'mama' && q.t < q.dur * 0.7);
      drawFace(ctx, 110, H * 0.3, 72, 'tata', { expr: this.tExpr, talk: tT, look: { x: 0.6, y: 1 } });
      drawFace(ctx, 290, H * 0.3, 72, 'mama', { expr: this.mExpr, talk: mT, look: { x: -0.6, y: 1 } });
      box(ctx, -20, H * 0.62, W + 40, H, 0, '#fffaf0', 3); ctx.fillStyle = 'rgba(231,111,81,0.15)'; for (let i = 0; i < 12; i++) ctx.fillRect(i * 40 - 10, H * 0.62, 20, H);
      drawCake(ctx, 200, H * 0.66, 2, !this.blown, 1.35);
      drawHandPOV(ctx, 70, H - 10, -1, 0, true); drawHandPOV(ctx, 330, H - 10, 1, 0, false);
    } else if (this.st === 'text') {
      ctx.fillStyle = '#140f1a'; ctx.fillRect(-20, -20, W + 40, H + 40);
    } else {
      const gy = this.gy, n = this.night;
      drawWallFloor(ctx, -20, W + 20, gy, '#3b3550'); drawWindow(ctx, 250, gy - 360, 110, 120, true);
      drawSofa(ctx, 30, gy, 300);
      drawAdult(ctx, 115, gy, 'tata', { pose: 'sit', seatY: gy - 84, f: 1, expr: 'sleep', A: { tor: -0.2 } });
      drawAdult(ctx, 215, gy, 'mama', { pose: 'sit', seatY: gy - 84, f: 1, expr: 'sleep', A: { tor: -0.15, u1: 0.9, f1: 1.6 } });
      box(ctx, 250, gy - 112, 46, 34, 4, '#e76f51', 3); ctx.fillStyle = '#fff'; ctx.font = F(9, 900); ctx.fillText('ALBUM', 255, gy - 91);
      ctx.fillStyle = `rgba(10,8,30,${0.35 * n})`; ctx.fillRect(-20, -20, W + 40, H + 40);
      const lg = ctx.createRadialGradient(300, gy - 200, 10, 300, gy - 200, 220); lg.addColorStop(0, 'rgba(255,220,150,0.35)'); lg.addColorStop(1, 'rgba(255,220,150,0)'); ctx.fillStyle = lg; ctx.fillRect(-20, -20, W + 40, H + 40);
      ctx.font = F(18, 900); ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillText('z', 150 + Math.sin(G.t) * 5, gy - 330 - (G.t * 20) % 40); ctx.fillText('z', 245 + Math.sin(G.t + 1) * 5, gy - 340 - (G.t * 20 + 20) % 40);
    }
  },
  drawUI(u) {
    if (this.st === 'cake' && !this.blown) { box(u, W / 2 - 60, H * 0.38, 120, 12, 6, 'rgba(255,255,255,0.7)', 2); box(u, W / 2 - 60, H * 0.38, 120 * clamp(this.hold / 1.2, 0, 1), 12, 6, '#48cae4', 0); }
    if (this.st === 'text' && this.lines) {
      u.textAlign = 'center';
      for (let i = 0; i <= Math.min(this.li, this.lines.length - 1); i++) {
        const cur = i === this.li, a = cur ? clamp(this.lt / 0.8, 0, 1) : 0.45;
        u.globalAlpha = a; u.fillStyle = i === this.lines.length - 1 ? '#f2cc8f' : '#f3ecf6';
        u.font = i === 0 ? F(30, 900) : i === 3 ? `italic 600 14px ${FONT}` : F(18, 800);
        const ls = wrapText(u, this.lines[i], 330); const y0 = H * 0.2 + i * 92;
        ls.forEach((l, j) => u.fillText(l, W / 2, y0 + j * (i === 3 ? 19 : 24)));
      }
      u.globalAlpha = 0.4; u.font = F(12, 700); u.fillStyle = '#fff'; u.fillText('dotknij', W / 2, H - 40); u.globalAlpha = 1; u.textAlign = 'left';
    }
  },
  down() { if (this.st === 'text') this.skip = true; },
};

// ================= BOOT =================
function boot() {
  load(); resize(); setupInput();
  let start = 'intro';
  try {
    const q = new URLSearchParams(location.search);
    const s = q.get('scene'); if (s && SCENES[s]) start = s;
    if (q.get('dev')) UI.dev = true;
    if (q.get('fresh')) { SAVE = freshSave(); META.album = []; META.eggs = []; }
  } catch (e) { }
  startScene(start);
  requestAnimationFrame(loop);
  try { if (document.fonts && document.fonts.load) { document.fonts.load('700 16px Nunito'); document.fonts.load('900 16px Nunito'); document.fonts.load('700 20px Caveat'); } } catch (e) { }
}
window.__gugu = { G, get SAVE() { return SAVE; }, META, SCENES, go, UI, pointers };
boot();
