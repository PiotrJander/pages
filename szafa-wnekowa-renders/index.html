<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Szafa wnękowa · wizualizacje</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f3f1ec; --panel:#fffefb; --ink:#1d1f21; --dim:#6b6f74; --line:#dcd7cd; --acc:#8a5a2b; --on:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16181a; --panel:#1f2225; --ink:#e9e6e1; --dim:#a3a8ad; --line:#33383d; --acc:#d9a066; --on:#16181a; color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;height:100dvh}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0 6px 0 0;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:6px 11px;border:none;background:transparent;color:var(--dim);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--on);font-weight:600}
.pick{display:flex;gap:6px;flex:1 1 280px;min-width:0}
select{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.nav{font:inherit;padding:0 11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;cursor:pointer}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;cursor:grab}
.stage.drag{cursor:grabbing}
.stage img{position:absolute;left:50%;top:50%;max-width:calc(100% - 24px);max-height:calc(100% - 24px);
  transform-origin:0 0;user-select:none;-webkit-user-drag:none;border-radius:4px;box-shadow:0 2px 14px rgba(0,0,0,.2)}
.hint{position:absolute;right:12px;bottom:10px;font-size:11px;color:var(--dim);background:var(--panel);border:1px solid var(--line);
  border-radius:7px;padding:2px 7px;opacity:.9;pointer-events:none}
footer{padding:7px 16px 10px;font-size:12.5px;color:var(--dim);background:var(--panel);border-top:1px solid var(--line)}
footer b{color:var(--ink);font-weight:600}
@media (max-width:640px){
  header{padding:8px 12px}
  h1{width:100%}
  .seg button{padding:6px 9px}
  .pick{flex-basis:100%}
  footer{padding:6px 12px 8px}
}
</style>
</head>
<body>
<header>
  <h1>Szafa wnękowa · wizualizacje</h1>
  <div class="seg" id="szafa" role="group" aria-label="Szafa">
    <button data-v="1">Szafa 1</button><button data-v="2">Szafa 2</button>
  </div>
  <div class="seg" id="decor" role="group" aria-label="Dekory">
    <button data-v="0" title="fronty klon H3840, korpus biały W1000">Fronty klon</button>
    <button data-v="1" title="fronty białe W1000, korpus klon H3840">Fronty białe</button>
  </div>
  <div class="pick">
    <button class="nav" id="prev" aria-label="Poprzednia">◀</button>
    <select id="shot" aria-label="Wizualizacja"></select>
    <button class="nav" id="next" aria-label="Następna">▶</button>
  </div>
</header>
<div class="stage" id="stage"><img id="img" alt=""><div class="hint" id="hint"></div></div>
<footer id="cap"></footer>

<script>
const $ = (id) => document.getElementById(id);
const MONTHS = ["stycznia", "lutego", "marca", "kwietnia", "maja", "czerwca", "lipca", "sierpnia", "września", "października", "listopada", "grudnia"];
const WEATHER = { clear: "pogodnie", hazy: "mgiełka", overcast: "pochmurno", rain: "ciemne chmury" };
const DOORS = { closed: "drzwi zamknięte", ajar: "drzwi uchylone", open: "drzwi otwarte" };
let items = [], sel = { szafa: 1, flip: 0, shot: null };

function caption(e) {
  const [, m, d] = e.date.split("-").map(Number);
  const lamps = [e.hall_lamp_1 && "lampa 1", e.hall_lamp_2 && "lampa 2", e.other_lamps && "pozostałe pokoje"].filter(Boolean);
  const sun = e.sun.elevation > 0 ? `słońce ${e.sun.elevation.toFixed(0)}° nad horyzontem` : "po zachodzie słońca";
  const bits = [`${d} ${MONTHS[m - 1]}, ${e.time}`, WEATHER[e.weather], sun,
    lamps.length ? `światło: ${lamps.join(", ")}` : "lampy wyłączone",
    e.door_angle !== undefined ? (e.door_angle ? `drzwi otwarte ${e.door_angle}°` : DOORS.closed) : DOORS[e.doors]];
  if (e.w1_right_hinge === "R") bits.push("prawe drzwi szafy 1 na zawiasach z prawej");
  return `<b>${e.name}</b> · ${bits.join(" · ")} · ${e.meta.width}×${e.meta.height}`;
}

function list() {
  return items.filter((e) => e.szafa === sel.szafa && e.flipped === !!sel.flip);
}

function render(pushHash = true) {
  for (const [id, v] of [["szafa", sel.szafa], ["decor", sel.flip]])
    $(id).querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.v) === v)));
  const opts = list();
  if (!opts.some((e) => e.shot === sel.shot)) sel.shot = opts[0].shot;
  $("shot").innerHTML = opts.map((e) => `<option value="${e.shot}">${e.name}</option>`).join("");
  $("shot").value = sel.shot;
  const e = opts.find((x) => x.shot === sel.shot);
  if ($("img").getAttribute("src") !== "renders/" + e.img) {
    $("img").src = "renders/" + e.img;
    $("img").alt = e.name;
    resetView();
  }
  $("cap").innerHTML = caption(e);
  if (pushHash) history.replaceState(null, "", `#szafa=${sel.szafa}&dekory=${sel.flip ? "zamienione" : "standard"}&ujecie=${sel.shot}`);
}

function step(d) {
  const opts = list(), i = opts.findIndex((e) => e.shot === sel.shot);
  sel.shot = opts[(i + d + opts.length) % opts.length].shot;
  render();
}

// ---- zoom & pan: pinch / drag on touch, wheel / drag with mouse, double-tap or double-click to reset
const view = { s: 1, x: 0, y: 0 };
const pts = new Map();
let pinch = null, lastTap = 0;

function apply() {
  const img = $("img"), w = img.offsetWidth, h = img.offsetHeight;
  img.style.transform = `translate(${view.x - w / 2}px, ${view.y - h / 2}px) scale(${view.s})`;
  $("hint").textContent = view.s > 1.01 ? `${Math.round(view.s * 100)}% · dwuklik: reset` : "powiększ: dwa palce lub kółko myszy";
}
function resetView() { view.s = 1; view.x = 0; view.y = 0; apply(); }
function zoomAt(cx, cy, f) {
  const r = $("stage").getBoundingClientRect(), px = cx - r.left - r.width / 2, py = cy - r.top - r.height / 2;
  const s = Math.min(Math.max(view.s * f, 1), 8), k = s / view.s;
  // image top-left sits at (view - size/2) from the stage centre; keep the point under the cursor fixed
  const w2 = $("img").offsetWidth / 2, h2 = $("img").offsetHeight / 2;
  view.x = px + w2 - k * (px - view.x + w2);
  view.y = py + h2 - k * (py - view.y + h2);
  view.s = s;
  if (s === 1) { view.x = 0; view.y = 0; }
  apply();
}

const stage = $("stage");
stage.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
stage.addEventListener("dblclick", resetView);
stage.addEventListener("pointerdown", (e) => {
  try { stage.setPointerCapture(e.pointerId); } catch {}
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  stage.classList.add("drag");
  if (e.pointerType === "touch" && pts.size === 1) {
    const now = Date.now();
    if (now - lastTap < 300) resetView();
    lastTap = now;
  }
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: view.s };
  }
});
stage.addEventListener("pointermove", (e) => {
  const p = pts.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2 && pinch) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, (pinch.s * d) / pinch.d / view.s);
    view.x += dx / 2; view.y += dy / 2;
    apply();
  } else if (pts.size === 1 && view.s > 1) {
    view.x += dx; view.y += dy;
    apply();
  }
});
const up = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) stage.classList.remove("drag"); };
stage.addEventListener("pointerup", up);
stage.addEventListener("pointercancel", up);
$("img").addEventListener("load", apply);
addEventListener("resize", apply);

// ---- controls
for (const [id, key] of [["szafa", "szafa"], ["decor", "flip"]])
  $(id).onclick = (e) => { const b = e.target.closest("button"); if (b) { sel[key] = Number(b.dataset.v); render(); } };
$("shot").onchange = (e) => { sel.shot = e.target.value; render(); };
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

(async function init() {
  items = await fetch("manifest.json").then((r) => r.json());
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("szafa")) sel.szafa = Number(h.get("szafa")) === 2 ? 2 : 1;
  if (h.get("dekory")) sel.flip = h.get("dekory") === "zamienione" ? 1 : 0;
  if (h.get("ujecie")) sel.shot = h.get("ujecie");
  render(false);
})();
</script>
</body>
</html>
