<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Alcove Wardrobe Design</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- measurements from 8 October: A1–A6 and beam drop G2 -->
<meta name="color-scheme" content="light dark" />
<style>
/* ---------- tokeny ---------- */
:root{
  --bg:#f4f2ee; --panel:#fffefb; --ink:#1d1f21; --dim:#6b6f74; --line:#dcd7cd;
  --acc:#8a5a2b; --acc-soft:#f0e6d8; --ok:#2e7d52; --warn:#b03a2e; --todo:#9aa0a6;
  --r:12px; --sh:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-text-size-adjust:100%;
}
body.fs-on{overflow:hidden}

main{max-width:940px;margin:0 auto;padding:0 16px 80px}
section{margin-top:18px}
h1{font-size:1.5rem;margin:.2em 0 .1em;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:1.4em 0 .4em;letter-spacing:-.01em}
h3{font-size:1.02rem;margin:1.3em 0 .3em}
h4{font-size:.94rem;margin:1.1em 0 .3em;color:var(--dim);font-weight:600}
p{margin:.5em 0}
.sub{color:var(--dim);margin:.1em 0 .8em}
.note{color:var(--dim);font-size:.88rem}
.dim{color:var(--dim)}
.warn{background:#fdecea;border-left:3px solid var(--warn);padding:.5em .7em;border-radius:0 8px 8px 0;font-size:.9rem;margin:.5em 0}
.ok{background:#e8f5ee;border-left:3px solid var(--ok);padding:.5em .7em;border-radius:0 8px 8px 0;font-size:.9rem;margin:.5em 0}
b{font-weight:650}
a{color:var(--acc)}

/* ---------- zakładki ---------- */
.tabs{display:flex;gap:6px;position:sticky;top:0;z-index:30;padding:10px 0;
  background:linear-gradient(var(--bg) 70%,transparent)}
.tabs button{
  flex:1;padding:.55em .4em;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

/* ---------- widok 3D ---------- */
.stage,.expwrap{
  position:relative;width:100%;height:min(62vh,520px);background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.stage{border-radius:0 0 var(--r) var(--r);border-top:none;height:min(58vh,480px)}
.pvcanvas{position:relative;width:100%;height:min(46vh,340px);background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stage canvas,.expwrap canvas,.pvcanvas canvas{display:block;width:100%;height:100%;touch-action:none}

.stage.fs,.expwrap.fs,.pvcanvas.fs{
  position:fixed;inset:0;width:100vw;height:100dvh;z-index:100;border-radius:0;border:none}

.fsbtn{position:absolute;top:8px;right:8px;z-index:6;width:34px;height:34px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:9px;cursor:pointer;font-size:15px;line-height:1;opacity:.92}
.views{position:absolute;top:8px;left:8px;z-index:6;display:flex;gap:4px;flex-wrap:wrap;max-width:60%}
.views button{border:1px solid var(--line);background:var(--panel);color:var(--dim);
  border-radius:8px;padding:.25em .55em;font:inherit;font-size:.78rem;cursor:pointer}
.chips{position:absolute;left:8px;bottom:8px;z-index:6;display:flex;gap:4px;flex-wrap:wrap;max-width:62%}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:7px;
  padding:.16em .42em;font:inherit;font-size:.72rem;font-family:var(--mono);cursor:pointer}

.pad{position:absolute;right:8px;bottom:8px;z-index:6;
  display:grid;grid-template-columns:repeat(3,30px);grid-template-rows:repeat(2,30px);gap:3px;
  grid-template-areas:". u ." "l c r"}
.pad button:nth-child(1){grid-area:u} .pad button:nth-child(2){grid-area:l}
.pad button:nth-child(3){grid-area:c} .pad button:nth-child(4){grid-area:r}
.pad button:nth-child(5){grid-area:.;position:absolute;left:33px;top:66px}
.pad{grid-template-rows:repeat(3,30px);grid-template-areas:". u ." "l c r" ". d ."}
.pad button:nth-child(5){grid-area:d;position:static;left:auto;top:auto}
.pad button{border:1px solid var(--line);background:var(--panel);color:var(--dim);
  border-radius:8px;font-size:13px;line-height:1;cursor:pointer;opacity:.92}

.fsctl{position:absolute;left:8px;right:8px;bottom:46px;z-index:7;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;box-shadow:var(--sh);max-height:44vh;overflow:auto}
.fsctl .chk{font-size:.84rem}

/* ---------- formularze ---------- */
.toggles{display:flex;flex-wrap:wrap;gap:.5em 1em;margin:.6em 0}
.chk{display:inline-flex;align-items:center;gap:.4em;font-size:.9rem;cursor:pointer;color:var(--dim)}
.chk input{accent-color:var(--acc);width:16px;height:16px}
.sl{display:flex;flex-direction:column;gap:2px;min-width:190px;flex:1 1 190px;font-size:.84rem;color:var(--dim)}
.sl input{width:100%;accent-color:var(--acc)}
.row{display:grid;grid-template-columns:1fr auto;gap:.2em .6em;align-items:center;margin:.7em 0}
.row label{font-size:.9rem}
.row output{font-family:var(--mono);font-size:.86rem;color:var(--acc);font-weight:600}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--acc)}
.row .cap{grid-column:1/-1;font-size:.78rem;color:var(--dim)}

.bar{height:5px;background:var(--acc-soft);border-radius:99px;overflow:hidden;margin:.5em 0 .3em}
.bar div{height:100%;background:var(--acc);transition:width .25s}
.prog{display:flex;justify-content:space-between;font-size:.78rem;color:var(--dim)}

.seg{display:flex;gap:6px;margin:.8em 0 .3em}
.seg button{flex:1;padding:.6em .5em;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);border-radius:10px;font:inherit;font-size:.88rem;cursor:pointer;text-align:center}
.seg button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

button{font:inherit}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:.5em 0}
.btns button{padding:.45em .9em;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);border-radius:9px;cursor:pointer;font-size:.88rem}
.btns button:hover{border-color:var(--acc);color:var(--acc)}

textarea,input[type=number]{width:100%;font-family:var(--mono);font-size:.82rem;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:.5em .6em;resize:vertical}
input[type=number]{font-size:1.5rem;text-align:center;padding:.35em}

/* ---------- details ---------- */
details{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:.2em .9em;margin:.7em 0;box-shadow:var(--sh)}
summary{cursor:pointer;font-weight:600;padding:.6em 0;font-size:.95rem;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸';display:inline-block;width:1.1em;color:var(--acc);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details>*:last-child{margin-bottom:.8em}

/* ---------- tabele ---------- */
table{width:100%;border-collapse:collapse;font-size:.86rem;margin:.4em 0}
th,td{text-align:left;padding:.36em .45em;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
td.n{font-family:var(--mono);font-size:.8rem;text-align:right;white-space:nowrap}
td.a{text-align:left}
.ptbl td.n:first-of-type{text-align:right}
.ptbl td:first-child{font-family:var(--mono);font-size:.78rem;color:var(--acc);font-weight:600;white-space:nowrap}
.pbtn{border:1px solid var(--line);background:var(--panel);color:var(--dim);
  border-radius:7px;padding:.1em .45em;font:inherit;font-size:.74rem;cursor:pointer}
.pbtn:hover{border-color:var(--acc);color:var(--acc)}

.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:.6em 0}
.sum div{background:var(--acc-soft);border-radius:10px;padding:.55em .7em}
.sum span{display:block;font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.03em}
.sum b{font-size:1.02rem}

.bul{margin:.4em 0;padding-left:1.15em}
.bul li{margin:.28em 0;font-size:.92rem}
.kw{display:inline-block;background:var(--acc-soft);color:var(--acc);border-radius:6px;
  padding:.06em .4em;font-size:.76rem;font-family:var(--mono);margin:1px 0}
.leg{display:flex;flex-wrap:wrap;gap:.4em .9em;font-size:.78rem;color:var(--dim);margin:.5em 0}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:.35em;vertical-align:-1px}

.step{display:flex;gap:.7em;margin:.7em 0}
.sn{flex:0 0 26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;
  display:grid;place-items:center;font-size:.8rem;font-weight:700}
.sc h4{margin:.1em 0 .1em;color:var(--ink);font-size:.95rem}
.sc p{margin:0;font-size:.9rem;color:var(--dim)}

/* ---------- lista pomiarów ---------- */
.grp{display:flex;align-items:center;gap:.4em;font-size:.78rem;color:var(--dim);
  text-transform:uppercase;letter-spacing:.03em;margin:.9em 0 .25em}
.grp i{width:10px;height:10px;border-radius:2px}
button.m{display:grid;grid-template-columns:52px 1fr auto;gap:.5em;align-items:center;width:100%;
  padding:.42em .5em;border:1px solid var(--line);background:var(--panel);
  border-radius:9px;margin:2px 0;cursor:pointer;text-align:left;color:var(--ink)}
button.m[data-done="0"]{border-style:dashed;opacity:.75}
button.m .id{font-family:var(--mono);font-size:.8rem;font-weight:700}
button.m .d{font-size:.84rem;color:var(--dim);line-height:1.3}
button.m .v{font-family:var(--mono);font-size:.84rem;font-weight:600}

/* ---------- dialog ---------- */
dialog{border:none;background:transparent;padding:0;max-width:min(94vw,420px);width:100%}
dialog.wide{max-width:min(94vw,640px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{background:var(--panel);color:var(--ink);border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.dlg h2{margin:0 0 .2em;font-size:1.1rem}
.dlg .unit{text-align:center;font-size:.75rem;color:var(--dim);margin-top:.25em}
.dlgbar{display:flex;gap:6px;margin-top:.9em}
.dlgbar button{flex:1;padding:.55em;border:1px solid var(--line);background:transparent;
  color:var(--ink);border-radius:9px;cursor:pointer;font-size:.88rem}
.dlgbar button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.dlgbar button:disabled{opacity:.4;cursor:default}
.nav{display:flex;gap:6px;margin-top:6px}
.nav button{flex:1;padding:.4em;border:none;background:transparent;color:var(--dim);
  cursor:pointer;font-size:.8rem}
.nav button:disabled{opacity:.3;cursor:default}

@media (max-width:560px){
  main{padding:0 12px 70px}
  h1{font-size:1.3rem}
  .views{max-width:52%}
  .chips{max-width:58%}
  button.m{grid-template-columns:46px 1fr auto}
  button.m .d{font-size:.78rem}
}

/* ---------- ciemny motyw: na końcu, żeby nadpisał ---------- */
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16181a; --panel:#1f2225; --ink:#e9e6e1; --dim:#a3a8ad; --line:#33383d;
    --acc:#d9a066; --acc-soft:#2e2921; --ok:#5fbf8d; --warn:#e8836f; --todo:#70767c;
    --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  .warn{background:#3a2420}
  .ok{background:#1e3129}
  .tabs button[aria-selected=true],.seg button[aria-pressed=true]{color:#16181a}
  .sn{color:#16181a}
  dialog::backdrop{background:rgba(0,0,0,.65)}
}

/* ---------- meble, lista zamówienia ---------- */
.seg.alc{margin:.2em 0 .6em;flex-wrap:wrap}
.seg.alc button{min-width:9em}
.btnlink{display:inline-block;padding:.55em 1em;border-radius:10px;background:var(--acc);color:#fff;text-decoration:none;font-weight:600;font-size:.92rem;border:1px solid var(--acc)}
.btnlink.alt{background:transparent;color:var(--acc)}
.btnlink:focus-visible,.seg button:focus-visible,.pbtn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-color-scheme:dark){ .btnlink{color:#16181a} .btnlink.alt{color:var(--acc)} }
.tscroll{overflow-x:auto;margin:.3em 0 .8em}
.otbl{min-width:640px;table-layout:fixed}
.otbl th,.otbl td{vertical-align:top}
.otbl th:nth-child(1){width:6%} .otbl th:nth-child(2),.otbl th:nth-child(5){width:5%}
.otbl th:nth-child(3){width:9%} .otbl th:nth-child(4){width:8%} .otbl th:nth-child(6){width:5%} .otbl th:nth-child(7){width:10%}
.otbl th:nth-child(3),.otbl th:nth-child(4),.otbl th:nth-child(6){text-align:right}
.otbl th:nth-child(2),.otbl th:nth-child(5),.otbl th:nth-child(7),.otbl td:nth-child(7){text-align:center}
.otbl td.mk{font-size:1.05rem;font-weight:700;text-align:center;color:var(--acc)}
.otbl .it{margin:1px 0 3px;font-size:.84rem;line-height:1.35}
.otbl .it .pbtn{margin-right:4px}
.sum small{display:block;font-size:.72rem;color:var(--dim)}
.leg i.chip{background:#b99c70 radial-gradient(#6e5636 1px,transparent 1.6px) 0 0/4px 4px}
.sh-pt.sh-s{fill:#e2eedd}
section h3{font-size:.98rem}

/* ---------- arkusze rozkroju ---------- */
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:.6em 0}
.sheet{margin:0}
.sheet svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.sh-bg{fill:#efe7da}
.sh-pt{fill:#fffefb;stroke:var(--acc);stroke-width:4}
.sh-tx{fill:var(--dim);text-anchor:middle;dominant-baseline:middle;font-family:var(--mono)}
.sheet figcaption{font-size:.76rem;color:var(--dim);margin-top:3px}
h4.shop{color:var(--ink)}

</style>

      ${tab === "plan" && html`<${PlanTab} all=${ALL} A=${A} B=${B} C=${C} onPanel=${setDlgPanel} />`}
    </main>

    <${PanelDialog} code=${dlgPanel} model=${ALL.model} onClose=${() => setDlgPanel(null)} />`;
}

// entry.js
render(html`<${App} />`, document.getElementById("app"));

</script>
</body>
</html>
